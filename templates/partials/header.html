{% load static %}

<!-- 1. HEADER (STAYS CLEAN AND INDEPENDENT) -->
<header data-site-header
    class="bg-pitch-black sticky top-0 z-40 border-b border-muted-steel w-full transition-all duration-300">
    <div
        class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-unit max-w-container-max mx-auto">

        {# Desktop nav #}
        <nav class="hidden md:flex items-center gap-8">
            <a href="{% url 'index' %}"
                class="font-body font-bold text-button uppercase tracking-widest pb-1 border-b-2 transition-colors scale-95 active:scale-90 {% if request.resolver_match.url_name == 'index' %}text-stark-white border-stark-white{% else %}text-outline border-transparent hover:text-stark-white{% endif %}">Home</a>
            <a href="{% url 'store' %}"
                class="font-body font-bold text-button uppercase tracking-widest pb-1 border-b-2 transition-colors scale-95 active:scale-90 {% if request.resolver_match.url_name == 'store' %}text-stark-white border-stark-white{% else %}text-outline border-transparent hover:text-stark-white{% endif %}">Shop</a>
            <a href="{% url 'lookbook' %}"
                class="font-body font-bold text-button uppercase tracking-widest pb-1 border-b-2 transition-colors scale-95 active:scale-90 {% if request.resolver_match.url_name == 'lookbook' %}text-stark-white border-stark-white{% else %}text-outline border-transparent hover:text-stark-white{% endif %}">Lookbook</a>
            <a href="{% url 'contact' %}"
                class="font-body font-bold text-button uppercase tracking-widest pb-1 border-b-2 transition-colors scale-95 active:scale-90
                            {% if request.resolver_match.url_name == 'contact' %}text-stark-white border-stark-white{% else %}text-outline border-transparent hover:text-stark-white{% endif %}">
                Contact
            </a>
        </nav>

        {# Logo #}
        <a href="{% url 'index' %}" class="flex-shrink-0">
            <img src="{% static 'hrlogowhite.png' %}" alt="HOODRANKED" class="h-8 md:h-10 my-4 object-contain">
        </a>

        {# Icons & Triggers #}
        <div class="flex items-center gap-6">
            <a href="{% url 'cart' %}" aria-label="Cart" class="text-stark-white hover:text-outline transition-colors relative">
                <span class="material-symbols-outlined">shopping_bag</span>
                <span
                    class="cart-count absolute -top-1 -right-1 bg-stark-white text-pitch-black text-[10px] font-bold px-1 rounded-full">{{ cart_count|default:"0" }}</span>
            </a>

            <!-- Main Toggle Button -->
            <button type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav-drawer"
                class="md:hidden text-stark-white relative w-6 h-6 flex items-center justify-center"
                data-mobile-menu-toggle>
                <span class="material-symbols-outlined absolute inset-0 transition-all duration-300 transform"
                    data-menu-icon-open>menu</span>
                <span
                    class="material-symbols-outlined absolute inset-0 transition-all duration-300 transform opacity-0 scale-75"
                    data-menu-icon-close>close</span>
            </button>
        </div>
    </div>
</header>

<!-- 2. MOBILE DRAWER BACKDROP (OUTSIDE HEADER, HIGHER Z-INDEX) -->
<div class="fixed inset-0 bg-pitch-black/70 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300 md:hidden"
    data-mobile-menu-backdrop></div>

<!-- 3. MOBILE NAV DRAWER (OUTSIDE HEADER, MAXIMUM Z-INDEX) -->
<nav id="mobile-nav-drawer" class="fixed top-0 right-0 h-full w-[78vw] max-w-sm bg-pitch-black border-l border-muted-steel z-50
        flex flex-col translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] md:hidden"
    data-mobile-menu>

    <div class="flex justify-between items-center px-margin-mobile py-unit border-b border-muted-steel h-[74px]">
        {# Drawer Logo #}
        <a href="{% url 'index' %}" class="flex-shrink-0">
            <img src="{% static 'hrlogowhite.png' %}" alt="HOODRANKED" class="h-4 object-contain">
        </a>

        <!-- Drawer Close Button -->
        <button type="button" aria-label="Close menu" class="text-stark-white flex items-center justify-center w-6 h-6"
            data-mobile-menu-toggle>
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    {# Links #}
    <div class="flex flex-col gap-8 px-margin-mobile pt-12">
        <a href="{% url 'index' %}" data-mobile-link
            class="font-body font-bold text-base uppercase {% if request.resolver_match.url_name == 'index' %}text-stark-white{% else %}text-outline{% endif %}">Home</a>
        <a href="{% url 'store' %}" data-mobile-link
            class="font-body font-bold text-base uppercase {% if request.resolver_match.url_name == 'store' %}text-stark-white{% else %}text-outline{% endif %}">Shop</a>
        <a href="{% url 'lookbook' %}" data-mobile-link
            class="font-body font-bold text-base uppercase {% if request.resolver_match.url_name == 'lookbook' %}text-stark-white{% else %}text-outline{% endif %}">Lookbook</a>
    </div>

    {# Footer Tagline #}
    <div class="mt-auto px-margin-mobile pb-10 pt-12 border-t border-muted-steel">
        <span class="font-mono text-label-caps text-outline text-xs block tracking-wider">CRAFTED FOR THOSE WHO COMMAND
            RESPECT</span>
    </div>
</nav>
