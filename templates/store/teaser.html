{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hood Ranked | Premium Streetwear</title>
    <link rel="icon" href="{% static 'hrlogowhite.jpg' %}" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center px-6 text-center">


    <div class="max-w-3xl">
        <img class="w-[240px] md:w-[120px] mx-auto mb-4" src="{% static 'logo2.jpeg' %}"
                    alt="Hood Ranked Logo">
        
        <p class="text-2xl md:text-4xl font-medium mb-4">
            BIG DROP + DISCOUNTS
        </p>
        
        <p class="text-xl md:text-3xl mb-12">
            Unlocks at <span class="text-yellow-400 font-bold">8:00 PM WAT</span> today
        </p>

        <!-- Optional: simple JS countdown -->
        <div class="grid grid-cols-3 gap-6 text-center max-w-md mx-auto">
            <div>
                <div id="hours" class="text-5xl md:text-6xl font-black">00</div>
                <div class="text-sm uppercase mt-2">Hours</div>
            </div>
            <div>
                <div id="minutes" class="text-5xl md:text-6xl font-black">00</div>
                <div class="text-sm uppercase mt-2">Minutes</div>
            </div>
            <div>
                <div id="seconds" class="text-5xl md:text-6xl font-black">00</div>
                <div class="text-sm uppercase mt-2">Seconds</div>
            </div>
        </div>

        <p class="mt-16 text-lg opacity-80">
            Premium streetwear dropping soon. Get ready 🔥
        </p>
    </div>

    <script>
        // Simple client-side countdown to 8 PM WAT
        function getTimeRemaining() {
            const now = new Date();
            const today8pm = new Date(now);
            today8pm.setHours(20, 0, 0, 0);

            if (now > today8pm) {
                today8pm.setDate(today8pm.getDate() + 1);
            }

            const diff = today8pm - now;
            if (diff <= 0) {
                location.reload(); // auto refresh when time is up
                return { hours: 0, minutes: 0, seconds: 0 };
            }

            return {
                hours: Math.floor(diff / (1000 * 60 * 60)),
                minutes: Math.floor((diff / (1000 * 60)) % 60),
                seconds: Math.floor((diff / 1000) % 60)
            };
        }

        function updateCountdown() {
            const t = getTimeRemaining();
            document.getElementById('hours').textContent   = String(t.hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(t.minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(t.seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
